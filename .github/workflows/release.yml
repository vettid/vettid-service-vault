name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # Build Vault Binaries
  # ============================================================================
  build-vault:
    name: Build Vault
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: vault/go.sum

      - name: Build
        working-directory: vault
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BUILD_TARGET: service-vault-${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" -o "$BUILD_TARGET" ./cmd/service-vault

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: service-vault-${{ matrix.goos }}-${{ matrix.goarch }}
          path: vault/service-vault-${{ matrix.goos }}-${{ matrix.goarch }}

  # ============================================================================
  # Create GitHub Release
  # ============================================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-vault]
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/service-vault-*; do
            name=$(basename "$dir")
            cp "$dir"/* "release/$name"
            chmod +x "release/$name"
          done
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}

  # ============================================================================
  # Publish Node.js SDK
  # ============================================================================
  publish-nodejs:
    name: Publish Node.js SDK
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: sdk/nodejs/package-lock.json

      - name: Install dependencies
        working-directory: sdk/nodejs
        run: npm ci

      - name: Build
        working-directory: sdk/nodejs
        run: npm run build --if-present

      - name: Update version and publish
        working-directory: sdk/nodejs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          # Extract version without 'v' prefix
          VERSION="${RELEASE_VERSION#v}"
          npm version "$VERSION" --no-git-tag-version
          npm publish --access public
        continue-on-error: true  # Skip if NPM_TOKEN not configured

  # ============================================================================
  # Publish Python SDK
  # ============================================================================
  publish-python:
    name: Publish Python SDK
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Update version and build
        working-directory: sdk/python
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          # Extract version without 'v' prefix
          VERSION="${RELEASE_VERSION#v}"
          sed -i "s/version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          python -m build

      - name: Publish to PyPI
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*
        continue-on-error: true  # Skip if PYPI_TOKEN not configured

  # ============================================================================
  # Docker Image
  # ============================================================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./vault
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
