name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Go Vault
  # ============================================================================
  vault-lint:
    name: Vault Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: vault/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: vault

  vault-test:
    name: Vault Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: vault/go.sum

      - name: Run tests
        working-directory: vault
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: vault/coverage.out
          flags: vault
        continue-on-error: true

  vault-build:
    name: Vault Build
    runs-on: ubuntu-latest
    needs: [vault-lint, vault-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: vault/go.sum

      - name: Build
        working-directory: vault
        run: go build -v ./cmd/service-vault

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: service-vault-linux-amd64
          path: vault/service-vault

  # ============================================================================
  # CDK Infrastructure
  # ============================================================================
  cdk-lint:
    name: CDK Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - name: Install dependencies
        working-directory: cdk
        run: npm ci

      - name: Lint
        working-directory: cdk
        run: npm run lint --if-present

  cdk-test:
    name: CDK Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - name: Install dependencies
        working-directory: cdk
        run: npm ci

      - name: Run tests
        working-directory: cdk
        run: npm test

  cdk-synth:
    name: CDK Synth
    runs-on: ubuntu-latest
    needs: [cdk-lint, cdk-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - name: Install dependencies
        working-directory: cdk
        run: npm ci

      - name: Synth
        working-directory: cdk
        run: npx cdk synth --quiet

  # ============================================================================
  # Node.js SDK
  # ============================================================================
  sdk-nodejs-lint:
    name: SDK Node.js Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/nodejs/package-lock.json

      - name: Install dependencies
        working-directory: sdk/nodejs
        run: npm ci

      - name: Type check
        working-directory: sdk/nodejs
        run: npx tsc --noEmit

      - name: Lint
        working-directory: sdk/nodejs
        run: npm run lint --if-present

  sdk-nodejs-test:
    name: SDK Node.js Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/nodejs/package-lock.json

      - name: Install dependencies
        working-directory: sdk/nodejs
        run: npm ci

      - name: Run tests
        working-directory: sdk/nodejs
        run: npm test --if-present

  sdk-nodejs-build:
    name: SDK Node.js Build
    runs-on: ubuntu-latest
    needs: [sdk-nodejs-lint, sdk-nodejs-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/nodejs/package-lock.json

      - name: Install dependencies
        working-directory: sdk/nodejs
        run: npm ci

      - name: Build
        working-directory: sdk/nodejs
        run: npm run build --if-present

  # ============================================================================
  # Python SDK
  # ============================================================================
  sdk-python-lint:
    name: SDK Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e ".[dev]"

      - name: Ruff check
        working-directory: sdk/python
        run: ruff check src/

      - name: Ruff format check
        working-directory: sdk/python
        run: ruff format --check src/

      - name: Type check
        working-directory: sdk/python
        run: mypy src/ --ignore-missing-imports

  sdk-python-test:
    name: SDK Python Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: sdk/python
        run: pytest -v --tb=short || echo "No tests found"

  # ============================================================================
  # Go SDK
  # ============================================================================
  sdk-go-lint:
    name: SDK Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: sdk/go/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: sdk/go

  sdk-go-test:
    name: SDK Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: sdk/go/go.sum

      - name: Run tests
        working-directory: sdk/go
        run: go test -v -race ./...

  sdk-go-build:
    name: SDK Go Build
    runs-on: ubuntu-latest
    needs: [sdk-go-lint, sdk-go-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: sdk/go/go.sum

      - name: Build
        working-directory: sdk/go
        run: go build ./...

  # ============================================================================
  # Summary
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - vault-build
      - cdk-synth
      - sdk-nodejs-build
      - sdk-python-lint
      - sdk-python-test
      - sdk-go-build
    steps:
      - name: All checks passed
        run: echo "All CI checks passed successfully!"
