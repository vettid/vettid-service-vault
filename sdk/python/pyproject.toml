[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vettid-service-vault"
version = "0.1.0"
description = "VettID Service Vault SDK for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "VettID", email = "sdk@vettid.com" }
]
keywords = ["vettid", "authentication", "authorization", "identity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pynacl>=1.5.0",
    "base58>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/vettid/vettid-service-vault"
Documentation = "https://docs.vettid.com/service-vault/sdk/python"
Repository = "https://github.com/vettid/vettid-service-vault.git"

[tool.hatch.build.targets.wheel]
packages = ["src/vettid_vault"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
